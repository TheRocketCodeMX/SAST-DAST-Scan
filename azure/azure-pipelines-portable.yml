# =============================================================================
# azure-pipelines-portable.yml · Azure Pipelines · DevSecOps OSS (rocket code)
# Version corta que usa el mismo script que AWS y GCP (devsecops/devsecops-scan.sh).
# Alternativa a azure-pipelines.yml (que corre los jobs en paralelo y tiene
# la pestana Scans). Usa el mismo variable group "devsecops-oss".
# =============================================================================
trigger:
  branches:
    include: [main, develop]
pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  - group: devsecops-oss
  - name: FAIL_ON_HIGH
    value: 'false'
  - name: ZAP_MODE
    value: baseline

jobs:
- job: devsecops
  displayName: DevSecOps (Opengrep, SonarQube, Trivy, ZAP, DefectDojo)
  timeoutInMinutes: 120
  steps:
  - checkout: self
    fetchDepth: 0
  - bash: bash devsecops/devsecops-scan.sh
    displayName: Escanear y reportar
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)
      DOJO_API_KEY: $(DOJO_API_KEY)
  - publish: devsecops-reports
    artifact: devsecops-reports
    condition: always()
  - publish: devsecops-reports/sarif
    artifact: CodeAnalysisLogs
    condition: always()
