# DevSecOps OSS · GitLab CI (rocket code)
# Settings > CI/CD > Variables: SONAR_HOST_URL, DOJO_URL, DAST_TARGET_URL,
#   SONAR_TOKEN (masked), DOJO_API_KEY (masked)
stages: [security]

devsecops:
  stage: security
  image:
    name: gcr.io/cloud-builders/docker
    entrypoint: [""]
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GIT_DEPTH: "0"
    FAIL_ON_HIGH: "false"
    ZAP_MODE: baseline
  timeout: 2h
  before_script:
    - apt-get -qq update >/dev/null && apt-get -qq install -y curl git jq >/dev/null
  script:
    - bash devsecops/devsecops-scan.sh
  artifacts:
    when: always
    paths: [devsecops-reports/]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
